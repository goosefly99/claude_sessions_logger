[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-session-logger"
version = "0.2.0"
description = "Local MCP server that logs Claude session task completions to daily JSONL files and generates cumulative weekly worklogs"
requires-python = ">=3.11"
license = "MIT"
keywords = ["mcp", "claude", "session-logger", "productivity", "task-tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Repository = "https://github.com/YOUR_USERNAME/claude-session-logger"

[tool.hatch.build.targets.wheel]
packages = ["session_logger"]

[project.scripts]
claude-session-logger = "session_logger.server:main"
